apply plugin: 'com.android.application'



android {
    namespace 'com.daimajia.androidviewhover.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.daimajia.androidviewmenu.demo"
        minSdk 14
        targetSdk 34
        renderscriptTargetApi 19
        renderscriptSupportModeEnabled true
        versionCode 2
        versionName "1.0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':library')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.makeramen:roundedimageview:1.3.0'
    implementation 'com.daimajia.androidanimations:library:1.1.2@aar'
    implementation 'com.nineoldandroids:library:2.4.0'
}



